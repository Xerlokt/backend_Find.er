version: '3.8'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jobtinder
      POSTGRES_PASSWORD: jobtinder
      POSTGRES_DB: jobtinder
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres_test:
    image: postgres:16
    environment:
      POSTGRES_USER: jobtinder_test
      POSTGRES_PASSWORD: jobtinder_test
      POSTGRES_DB: jobtinder_test
    ports:
      - '5433:5432'

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/jobtinder
    ports:
      - '7474:7474'
      - '7687:7687'
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  redis_test:
    image: redis:7
    ports:
      - '6380:6379'

volumes:
  postgres_data:
  neo4j_data:
